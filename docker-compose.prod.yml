services:
  # ====================================================
  # NGINX EDGE LOAD BALANCER & REVERSE PROXY
  # ====================================================
  nginx:
    image: nginx:alpine
    container_name: production-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./apps/client/dist:/usr/share/nginx/html:ro
    depends_on:
      - server-node-1
      - server-node-2
      - server-node-3
      - server-node-4
      - server-node-5
      - server-node-6
    networks:
      - edge-net
      - app-net

  # ====================================================
  # 6 EXPRESS BACKEND LOAD-BALANCED NODES
  # ====================================================
  server-node-1:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: express-node-1
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/encrypt_creds_db
      - ENABLE_AEROSPIKE=true
      - AEROSPIKE_HOST=aerospike
      - AEROSPIKE_PORT=3000
      - JWT_SECRET=bhandara_karado_babuji
      - ADMIN_EMAIL=khare.pranavmhs@gmail.com
      - ADMIN_PASSWORD=Admin@12345
      - SILENT_LOGS=true
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-net
      - db-net

