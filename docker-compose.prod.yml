  # ====================================================
  # AEROSPIKE REAL-TIME HOT KEY-VALUE & SESSION STORE
  # ====================================================
  aerospike:
    image: aerospike/aerospike-server:latest
    container_name: prod-aerospike
    restart: always
    environment:
      - NAMESPACE=test
    networks:
      - db-net

  # ====================================================
  # TUNED MONGODB (VFS Tree & Document Store)
  # ====================================================
  mongodb:
    image: mongo:latest
    container_name: prod-mongodb
    restart: always
    command: mongod --wiredTigerCacheSizeGB 4 --maxConns 30000 --syncdelay 120
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - mongo_prod_data:/data/db
    networks:
      - db-net

networks:
  edge-net:
    driver: bridge
  app-net:
    driver: bridge
  db-net:
    driver: bridge

volumes:
  mongo_prod_data:
