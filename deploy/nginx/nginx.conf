user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance Tuning
    sendfile        on;
    tcp_nopush     on;
    tcp_nodelay    on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Rate Limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # ==========================================
    # UPSTREAM LOAD BALANCER POOL
    # ==========================================
    upstream express_backend {
        least_conn;

        server server-node-1:3000 max_fails=3 fail_timeout=10s;
        server server-node-2:3000 max_fails=3 fail_timeout=10s;
        server server-node-3:3000 max_fails=3 fail_timeout=10s;

        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        client_max_body_size 10G;
        client_body_timeout 300s;

        # Frontend Static Files
        root /usr/share/nginx/html;
        index index.html;

        # ----------------------------------------------------
        # 1. FRONTEND ROUTING & ASSETS
        # ----------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            expires 1d;
            add_header Cache-Control "public, no-transform";
        }

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ----------------------------------------------------
        # 2. AUTH RATE LIMITING (/api/signin, /api/signup)
        # ----------------------------------------------------
        location ~ ^/api/(signin|signup) {
            limit_req zone=auth_limit burst=20 nodelay;

            proxy_pass http://express_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----------------------------------------------------
        # 3. REAL-TIME SSE BROADCASTS (/api/admin/events/sse)
        # ----------------------------------------------------
        location /api/admin/events/sse {
            proxy_pass http://express_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;
            chunked_transfer_encoding on;
        }

        # ----------------------------------------------------
        # 4. VIDEO/AUDIO STREAMING & FILE PREVIEWS
        # ----------------------------------------------------
        location ~ ^/api/files/[^/]+/(preview|download) {
            proxy_pass http://express_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_force_ranges on;
            proxy_buffering off;
            proxy_read_timeout 600s;
        }

        # ----------------------------------------------------
        # 5. GENERAL API PROXY
        # ----------------------------------------------------
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;

            proxy_pass http://express_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
