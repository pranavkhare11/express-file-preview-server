<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <input type="text" id="name" placeholder="Full Name" required />
            <input type="email" id="email" placeholder="Email" required />
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Password" required />
                <button type="button" class="toggle-password" title="Show/Hide Password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <div class="password-wrapper">
                <input type="password" id="confirm-password" placeholder="Confirm Password" required />
                <button type="button" class="toggle-password" title="Show/Hide Password">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                </button>
            </div>
            <div style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="age">
                <label for="age" style="cursor: pointer;">I am over 18 years old</label>
            </div>
            <button type="submit" id="submitBtn" disabled>Sign Up</button>
        </form>
        <p style="margin-top: 15px; text-align: center; font-size: 0.9rem;">
            Already have an account? <a href="index.html">Sign In</a>
        </p>
    </div>

    <script>
        if (localStorage.getItem('token')) {
            window.location.href = '/dashboard.html';
        }

        const ageCheckbox = document.getElementById('age');
        const submitBtn = document.getElementById('submitBtn');
        ageCheckbox.addEventListener('change', () => {
            submitBtn.disabled = !ageCheckbox.checked;
        });

        document.querySelectorAll('.toggle-password').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                const input = btn.closest('.password-wrapper').querySelector('input');
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
            });
        });

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;



            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    window.location.href = '/dashboard.html';
                } else {
                    alert(data.error || 'Signup failed');
                }
            } catch (err) {
                console.log(err);
            }
        });
    </script>
</body>

</html>
